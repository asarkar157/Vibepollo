---
name: CI-Windows
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build_windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-AMD64
            os: windows-2022
            arch: x86_64
            msystem: ucrt64
            toolchain: ucrt-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Prepare tests
        id: prepare-tests
        if: false  # todo: DirectX11 is not available, so even software encoder fails
        shell: pwsh
        run: |
          # function to download and extract a zip file
          function DownloadAndExtract {
            param (
              [string]$Uri,
              [string]$OutFile
            )

            $maxRetries = 5
            $retryCount = 0
            $success = $false

            while (-not $success -and $retryCount -lt $maxRetries) {
              $retryCount++
              Write-Host "Downloading $Uri to $OutFile, attempt $retryCount of $maxRetries"
              try {
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile
                $success = $true
              } catch {
                Write-Host "Attempt $retryCount of $maxRetries failed with error: $($_.Exception.Message). Retrying..."
                Start-Sleep -Seconds 5
              }
            }

            if (-not $success) {
              Write-Host "Failed to download the file after $maxRetries attempts."
              exit 1
            }

            # use .NET to get the base name of the file
            $baseName = (Get-Item $OutFile).BaseName

            # Extract the zip file
            Expand-Archive -Path $OutFile -DestinationPath $baseName
          }

          # virtual display driver
          DownloadAndExtract `
            -Uri "https://www.amyuni.com/downloads/usbmmidd_v2.zip" `
            -OutFile "usbmmidd_v2.zip"

          # install
          Set-Location -Path usbmmidd_v2/usbmmidd_v2
          ./deviceinstaller64 install usbmmidd.inf usbmmidd

          # create the virtual display
          ./deviceinstaller64 enableidd 1

          # move up a directory
          Set-Location -Path ../..

          # install devcon
          DownloadAndExtract `
            -Uri "https://github.com/Drawbackz/DevCon-Installer/releases/download/1.4-rc/Devcon.Installer.zip" `
            -OutFile "Devcon.Installer.zip"
          Set-Location -Path Devcon.Installer
          # hash needs to match OS version
          # https://github.com/Drawbackz/DevCon-Installer/blob/master/devcon_sources.json
          Start-Process -FilePath "./Devcon Installer.exe" -Wait -ArgumentList `
            'install', `
            '-hash', '54004C83EE34F6A55380528A8B29F4C400E61FBB947A19E0AB9E5A193D7D961E', `
            '-addpath', `
            '-update', `
            '-dir', 'C:\Windows\System32'

          # disable Hyper-V Video
          # https://stackoverflow.com/a/59490940
          C:\Windows\System32\devcon.exe disable "VMBUS\{da0a7802-e377-4aac-8e77-0558eb1073f8}"

          # move up a directory
          Set-Location -Path ..

          # multi monitor tool
          DownloadAndExtract `
            -Uri "http://www.nirsoft.net/utils/multimonitortool-x64.zip" `
            -OutFile "multimonitortool.zip"

          # enable the virtual display
          # http://www.nirsoft.net/utils/multi_monitor_tool.html
          Set-Location -Path multimonitortool

          # Original Hyper-V is \\.\DISPLAY1, it will recreate itself as \\.\DISPLAY6 (or something higher than 2)
          # USB Mobile Monitor Virtual Display is \\.\DISPLAY2

          # these don't seem to work if not using runAs
          # todo: do they work if not using runAs?
          Start-Process powershell -Verb runAs -ArgumentList '-Command ./MultiMonitorTool.exe /enable \\.\DISPLAY2'
          Start-Process powershell -Verb runAs -ArgumentList '-Command ./MultiMonitorTool.exe /SetPrimary \\.\DISPLAY2'

          # wait a few seconds
          Start-Sleep -s 5

          # list monitors
          ./MultiMonitorTool.exe /stext monitor_list.txt

          # wait a few seconds
          Start-Sleep -s 5

          # print the monitor list
          Get-Content -Path monitor_list.txt

      # Install all build dependencies via setup-msys2's own install list. This is the
      # pattern proven working in this fork's build.yml (commit e2eaa98f); installing via a
      # separate `pacman -Syu` run step leaves the ucrt64 bin dir off the `msys2 {0}` PATH,
      # so cmake/ninja aren't found in later steps.
      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            mingw-w64-${{ matrix.toolchain }}-cmake
            mingw-w64-${{ matrix.toolchain }}-ninja
            mingw-w64-${{ matrix.toolchain }}-gcc
            mingw-w64-${{ matrix.toolchain }}-boost
            mingw-w64-${{ matrix.toolchain }}-openssl
            mingw-w64-${{ matrix.toolchain }}-opus
            mingw-w64-${{ matrix.toolchain }}-curl
            mingw-w64-${{ matrix.toolchain }}-nlohmann-json
            mingw-w64-${{ matrix.toolchain }}-miniupnpc
            mingw-w64-${{ matrix.toolchain }}-cppwinrt
            mingw-w64-${{ matrix.toolchain }}-nodejs
            mingw-w64-${{ matrix.toolchain }}-nsis
            mingw-w64-${{ matrix.toolchain }}-onevpl
            git

      # MinHook isn't a reliable MSYS2 package for this toolchain; build + install it into
      # the ucrt64 prefix so the REQUIRED find_library(libMinHook.a) in
      # cmake/dependencies/windows.cmake succeeds. (Locally it's already in the prefix.)
      - name: Build and install MinHook
        # NB: do NOT set env.MSYSTEM here — setup-msys2 configures the msys2 {0} shell with
        # the correct uppercase UCRT64. Overriding it with the lowercase matrix value makes
        # the shell fall back to plain MSYS mode, so /ucrt64/bin (cmake, ninja) drops off PATH.
        shell: msys2 {0}
        run: |
          set -e
          git clone --depth 1 https://github.com/TsudaKageyu/minhook.git "${RUNNER_TEMP}/minhook"
          cmake -S "${RUNNER_TEMP}/minhook" -B "${RUNNER_TEMP}/minhook/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/minhook/build"
          # The static lib name varies by toolchain (libMinHook.a, libminhook.a,
          # minhook.x64.a, ...); match any of them case-insensitively.
          lib=$(find "${RUNNER_TEMP}/minhook/build" -iname '*minhook*.a' | head -1)
          echo "built MinHook static lib: $lib"
          if [ -z "$lib" ]; then echo "ERROR: no MinHook static lib found" >&2; find "${RUNNER_TEMP}/minhook/build" -name '*.a' >&2; exit 1; fi
          cp "$lib" "${MINGW_PREFIX}/lib/libMinHook.a"
          cp "${RUNNER_TEMP}/minhook/include/MinHook.h" "${MINGW_PREFIX}/include/MinHook.h"
          ls -l "${MINGW_PREFIX}/lib/libMinHook.a" "${MINGW_PREFIX}/include/MinHook.h"

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Python Path
        id: python-path
        shell: msys2 {0}
        run: |
          # replace backslashes with double backslashes
          python_path=$(echo "${{ steps.setup-python.outputs.python-path }}" | sed 's/\\/\\\\/g')

          # step output
          echo "python-path=${python_path}"
          echo "python-path=${python_path}" >> "${GITHUB_OUTPUT}"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y

      # package-lock.json is gitignored, but the web-ui cmake target runs `npm ci`, which
      # requires a lockfile. Generate one from package.json before the build.
      - name: Generate web UI lockfile
        shell: msys2 {0}
        working-directory: src_assets/common/assets/web
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Build Windows
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ inputs.release_version }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          COMMIT: ${{ inputs.release_commit }}
        run: |
          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DZLIB="$(cygpath -m "${MINGW_PREFIX}/bin/zlib1.dll")" \
            -DSUNSHINE_BUNDLE_SUDOVDA=OFF \
            -DSUNSHINE_PUBLISHER_NAME='${{ github.repository_owner }}' \
            -DSUNSHINE_PUBLISHER_WEBSITE='https://github.com/${{ github.repository }}' \
            -DSUNSHINE_PUBLISHER_ISSUE_URL='https://github.com/${{ github.repository }}/issues'
          echo "::add-matcher::.github/matchers/gcc.json"
          ninja -C build
          echo "::remove-matcher owner=gcc::"

      # WiX already installed before configure so env:WIX is available

      - name: Package Windows
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          cd build

          # package
          cpack -G WIX
          cpack -G ZIP

          # build custom installer executable that wraps the MSI payload
          powershell -NoProfile -ExecutionPolicy Bypass -File ../packaging/windows/bootstrapper/build_bootstrapper.ps1 -BuildDir "$(cygpath -w "$(pwd)")"

          msi_file=$(ls -1 ./cpack_artifacts/*.msi | head -n 1)
          installer_exe=$(ls -1 ./cpack_artifacts/VibepolloSetup.exe ./cpack_artifacts/*-installer.exe 2>/dev/null | head -n 1)
          portable_zip=$(ls -1 ./cpack_artifacts/*.zip | head -n 1)

          # move
          mv "${msi_file}" ../artifacts/Vibepollo-${{ matrix.name }}-installer.msi
          mv "${installer_exe}" ../artifacts/Vibepollo-${{ matrix.name }}-installer.exe
          mv "${portable_zip}" ../artifacts/Vibepollo-${{ matrix.name }}-portable.zip

      - name: Run tests
        id: test
        # Don't let a display-dependent test failure on a headless runner block the
        # installer artifact upload — this is an unsigned test build.
        continue-on-error: true
        shell: msys2 {0}
        working-directory: build/tests
        run: ./test_sunshine.exe --gtest_color=yes --gtest_output=xml:test_results.xml

      - name: Generate gcov report
        id: test_report
        # Coverage is best-effort: this build isn't coverage-instrumented, so don't let a
        # missing report block the installer artifact.
        continue-on-error: true
        # any except canceled or skipped
        if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        shell: msys2 {0}
        working-directory: build
        run: |
          ${{ steps.python-path.outputs.python-path }} -m pip install gcovr
          ${{ steps.python-path.outputs.python-path }} -m gcovr . -r ../src \
            --exclude-noncode-lines \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --verbose \
            --xml-pretty \
            -o coverage.xml

      - name: Upload coverage artifact
        continue-on-error: true
        if: >-
          always() &&
          (steps.test_report.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: |
            build/coverage.xml
            build/tests/test_results.xml
          if-no-files-found: error

      - name: Package Windows Debug Info
        shell: pwsh
        working-directory: build
        run: |
          # use .dbg file extension for binaries to avoid confusion with real packages
          Get-ChildItem -File -Recurse | `
            % { Rename-Item -Path $_.PSPath -NewName $_.Name.Replace(".exe",".dbg") }

          # save the binaries with debug info
          7z -r `
            "-xr!CMakeFiles" `
            "-xr!cpack_artifacts" `
            a "../artifacts/Vibepollo-${{ matrix.name }}-debuginfo.7z" "*.dbg"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error
